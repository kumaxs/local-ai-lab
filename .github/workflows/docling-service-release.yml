name: Docling Service release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          ref_name="${GITHUB_REF_NAME}"
          version="${ref_name#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH" >&2
            exit 2
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/docling-service/requirements.txt
            services/docling-service/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "services/docling-service[api]"
      - name: Run docling serve parity contract tests
        run: PYTHONPATH=docs/integrations/docling-serve-quality-parity python -m unittest discover -s docs/integrations/docling-serve-quality-parity -p 'test_*.py'
      - name: Verify version alignment
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from docling_service.formula_api import FORMULA_SERVICE_VERSION
          from docling_service.release import RELEASE_VERSION

          project = tomllib.loads(Path("services/docling-service/pyproject.toml").read_text())
          expected = os.environ["RELEASE_VERSION"]
          actual = {project["project"]["version"], RELEASE_VERSION, FORMULA_SERVICE_VERSION}
          if actual != {expected}:
              raise SystemExit(f"version mismatch: tag={expected}, code={sorted(actual)}")
          PY
      - name: Run service tests
        run: PYTHONPATH=services/docling-service python -m unittest discover services/docling-service/tests
      - name: Compile release sources
        run: |
          python -m py_compile \
            services/docling-service/docling_service/*.py \
            services/docling-service/release/*.py \
            docs/integrations/docling-serve-quality-parity/*.py
      - name: Validate Compose definitions
        run: |
          docker compose -f services/docling-service/deploy/docker/compose.yaml config --quiet
          docker compose -f services/docling-service/deploy/docker/compose.release.yaml config --quiet
      - name: Validate release shell scripts
        run: |
          sh -n services/docling-service/release/docker-up.sh
          sh -n services/docling-service/release/docker-down.sh

  macos-package:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build and verify clean macOS bundle
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python services/docling-service/release/build_release_bundle.py \
            --output-dir "${RUNNER_TEMP}/dist" \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}"
          python services/docling-service/release/verify_release_bundle.py \
            --checksums "${RUNNER_TEMP}/dist/SHA256SUMS" \
            "${RUNNER_TEMP}/dist/docling-service-${RELEASE_VERSION}.tar.gz" \
            "${RUNNER_TEMP}/dist/docling-service-${RELEASE_VERSION}.zip"
          mkdir -p "${RUNNER_TEMP}/extract"
          tar -xzf "${RUNNER_TEMP}/dist/docling-service-${RELEASE_VERSION}.tar.gz" \
            -C "${RUNNER_TEMP}/extract"
          bundle="${RUNNER_TEMP}/extract/docling-service-${RELEASE_VERSION}"
          zsh -n "${bundle}/install-macos.sh"
          for script in "${bundle}"/services/docling-service/deploy/macos/*.sh; do
            zsh -n "${script}"
          done
          DOCLING_INSTALL_COPY_ONLY=true \
            DOCLING_INSTALL_ROOT="${RUNNER_TEMP}/installed release" \
            zsh "${bundle}/install-macos.sh"
          test -f "${RUNNER_TEMP}/installed release/RELEASE_MANIFEST.json"

  bundle:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build release assets
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python services/docling-service/release/build_release_bundle.py \
            --output-dir dist \
            --version "${RELEASE_VERSION}" \
            --commit "${GITHUB_SHA}"
          python services/docling-service/release/verify_release_bundle.py \
            --checksums dist/SHA256SUMS \
            "dist/docling-service-${RELEASE_VERSION}.tar.gz" \
            "dist/docling-service-${RELEASE_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: docling-service-${{ needs.validate.outputs.version }}
          path: dist/*
          if-no-files-found: error

  images:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: services/docling-service/deploy/docker/Dockerfile.api
          - image: backend
            dockerfile: services/docling-service/deploy/docker/Dockerfile.backend
          - image: formula
            dockerfile: services/docling-service/deploy/docker/Dockerfile.formula
    steps:
      - uses: actions/checkout@v4
      - id: registry
        shell: bash
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
      - id: build-date
        shell: bash
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.registry.outputs.namespace }}/local-ai-lab-docling-${{ matrix.image }}:${{ needs.validate.outputs.version }}
            ${{ steps.registry.outputs.namespace }}/local-ai-lab-docling-${{ matrix.image }}:latest
          build-args: |
            RELEASE_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=docling-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=docling-${{ matrix.image }}
          provenance: mode=max
          sbom: true

  release:
    needs: [validate, macos-package, bundle, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docling-service-${{ needs.validate.outputs.version }}
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --verify-tag \
              --title "Docling Service ${RELEASE_VERSION}" \
              --notes-file services/docling-service/release/RELEASE_NOTES.md
          fi
