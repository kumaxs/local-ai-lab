name: Docling Service CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  API_IMAGE: local-ai-lab/docling-service-api:ci

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/docling-service/requirements.txt
            services/docling-service/pyproject.toml

      - name: Install Docling Service API dependencies
        run: python -m pip install "services/docling-service[api]"

      - name: Run docling serve parity contract tests
        run: PYTHONPATH=docs/integrations/docling-serve-quality-parity python -m unittest discover -s docs/integrations/docling-serve-quality-parity -p 'test_*.py'

      - name: Run service tests
        run: PYTHONPATH=services/docling-service python -m unittest discover services/docling-service/tests

      - name: Validate Compose definitions
        run: |
          docker compose -f services/docling-service/deploy/docker/compose.yaml config --quiet
          docker compose -f services/docling-service/deploy/docker/compose.release.yaml config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/docling-service/deploy/docker/Dockerfile.api
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.API_IMAGE }}

      - name: Verify API import in container
        run: docker run --rm --entrypoint python "${API_IMAGE}" -c "import docling_service.api"
