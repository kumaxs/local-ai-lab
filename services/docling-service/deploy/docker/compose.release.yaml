name: local-ai-lab-docling

services:
  backend:
    logging:
      driver: json-file
      options:
        max-size: "${DOCLING_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCLING_DOCKER_LOG_MAX_FILE:-3}"
    image: "${DOCLING_IMAGE_NAMESPACE:-ghcr.io/kumaxs}/local-ai-lab-docling-backend:${DOCLING_VERSION:-1.1.0}"
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
      DOCLING_DEVICE: ${DOCLING_DEVICE:-cpu}
      DOCLING_SERVE_MAX_SYNC_WAIT: ${DOCLING_CONVERSION_TIMEOUT_SECONDS:-7200}
      OMP_NUM_THREADS: ${DOCLING_CPU_THREADS:-4}
      MKL_NUM_THREADS: ${DOCLING_CPU_THREADS:-4}
    shm_size: 1gb
    volumes:
      - docling-models:/models

  formula:
    logging:
      driver: json-file
      options:
        max-size: "${DOCLING_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCLING_DOCKER_LOG_MAX_FILE:-3}"
    image: "${DOCLING_IMAGE_NAMESPACE:-ghcr.io/kumaxs}/local-ai-lab-docling-formula:${DOCLING_VERSION:-1.1.0}"
    pull_policy: always
    init: true
    restart: unless-stopped
    environment:
      HF_ENDPOINT: "${HF_ENDPOINT:-https://hf-mirror.com}"
      DOCLING_FORMULA_MODEL: ${DOCLING_FORMULA_MODEL:-wanderkid/unimernet_small}
      DOCLING_FORMULA_FALLBACK_MODEL: ${DOCLING_FORMULA_FALLBACK_MODEL:-PP-FormulaNet-L}
      DOCLING_FORMULA_BATCH_SIZE: "1"
      DOCLING_FORMULA_MIN_SOURCE_COVERAGE: ${DOCLING_FORMULA_MIN_SOURCE_COVERAGE:-0.82}
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - docling-formula-models:/models

  api:
    logging:
      driver: json-file
      options:
        max-size: "${DOCLING_DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCLING_DOCKER_LOG_MAX_FILE:-3}"
    image: "${DOCLING_IMAGE_NAMESPACE:-ghcr.io/kumaxs}/local-ai-lab-docling-api:${DOCLING_VERSION:-1.1.0}"
    pull_policy: always
    init: true
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      formula:
        condition: service_healthy
    ports:
      - "${DOCLING_API_BIND:-127.0.0.1}:${DOCLING_API_PORT:-8766}:8000"
    environment:
      DOCLING_RELEASE_PROFILE: docker
      DOCLING_SERVE_URL: http://backend:5001
      DOCLING_INPUT_ROOT: /data/inputs
      DOCLING_OUTPUT_ROOT: /data/outputs
      DOCLING_STATE_ROOT: /data/state
      DOCLING_FORMULA_POLICY: formula_service
      DOCLING_FORMULA_OCR_URL: http://formula:8001
      DOCLING_CN_OCR_PARITY: "false"
      DOCLING_IMAGE_EXPORT_MODE: embedded
      DOCLING_MAX_CONCURRENT_JOBS: ${DOCLING_MAX_CONCURRENT_JOBS:-1}
      DOCLING_CONVERSION_TIMEOUT_SECONDS: ${DOCLING_CONVERSION_TIMEOUT_SECONDS:-7200}
      DOCLING_MAX_UPLOAD_BYTES: ${DOCLING_MAX_UPLOAD_BYTES:-268435456}
      DOCLING_MAX_CONCURRENT_UPLOADS: ${DOCLING_MAX_CONCURRENT_UPLOADS:-2}
      DOCLING_INPUT_TTL_SECONDS: ${DOCLING_INPUT_TTL_SECONDS:-86400}
      DOCLING_SUCCESS_OUTPUT_TTL_SECONDS: ${DOCLING_SUCCESS_OUTPUT_TTL_SECONDS:-604800}
      DOCLING_FAILED_OUTPUT_TTL_SECONDS: ${DOCLING_FAILED_OUTPUT_TTL_SECONDS:-172800}
      DOCLING_JOB_TTL_SECONDS: ${DOCLING_JOB_TTL_SECONDS:-2592000}
      DOCLING_WEBHOOK_DELIVERY_TTL_SECONDS: ${DOCLING_WEBHOOK_DELIVERY_TTL_SECONDS:-604800}
      DOCLING_STAGING_TTL_SECONDS: ${DOCLING_STAGING_TTL_SECONDS:-3600}
      DOCLING_TEMP_TTL_SECONDS: ${DOCLING_TEMP_TTL_SECONDS:-3600}
      DOCLING_CLEANUP_INTERVAL_SECONDS: ${DOCLING_CLEANUP_INTERVAL_SECONDS:-300}
      DOCLING_MAX_PENDING_JOBS: ${DOCLING_MAX_PENDING_JOBS:-20}
      DOCLING_MAX_OUTPUT_BYTES: ${DOCLING_MAX_OUTPUT_BYTES:-5368709120}
      DOCLING_MAX_DATA_BYTES: ${DOCLING_MAX_DATA_BYTES:-53687091200}
      DOCLING_MIN_FREE_BYTES: ${DOCLING_MIN_FREE_BYTES:-2147483648}
      DOCLING_IDEMPOTENCY_TTL_SECONDS: ${DOCLING_IDEMPOTENCY_TTL_SECONDS:-86400}
      DOCLING_DOWNLOAD_LEASE_SECONDS: ${DOCLING_DOWNLOAD_LEASE_SECONDS:-300}
      DOCLING_WEBHOOK_MAX_ATTEMPTS: ${DOCLING_WEBHOOK_MAX_ATTEMPTS:-6}
      DOCLING_MAX_WEBHOOK_SUBSCRIPTIONS: ${DOCLING_MAX_WEBHOOK_SUBSCRIPTIONS:-100}
      DOCLING_WEBHOOK_ALLOWED_HOSTS: ${DOCLING_WEBHOOK_ALLOWED_HOSTS:-}
      DOCLING_WEBHOOK_ALLOW_PRIVATE_HOSTS: ${DOCLING_WEBHOOK_ALLOW_PRIVATE_HOSTS:-false}
      DOCLING_SERVICE_API_TOKEN: ${DOCLING_SERVICE_API_TOKEN:-}
    volumes:
      - docling-inputs:/data/inputs
      - docling-outputs:/data/outputs
      - docling-state:/data/state

volumes:
  docling-models:
  docling-formula-models:
  docling-inputs:
  docling-outputs:
  docling-state:
